# KaamConnect backend stack. Bidding/notification fan-out runs as an isolated
# `worker` process so it cannot impact core API uptime (target 99.9%).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sahulat
      POSTGRES_PASSWORD: sahulat
      POSTGRES_DB: sahulat
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahulat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://sahulat:sahulat@db:5432/sahulat
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://sahulat:sahulat@db:5432/sahulat
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
